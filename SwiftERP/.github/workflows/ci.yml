name: SwiftERP CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-test:
    name: Backend Build & Unit Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore backend/SwiftERP.sln

    - name: Build Backend Solution
      run: dotnet build backend/SwiftERP.sln --no-restore --configuration Release

    - name: Run Backend Unit & Integration Tests
      run: dotnet test backend/SwiftERP.sln --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Build (Angular 18)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend Application
      working-directory: ./frontend
      run: npm run build -- --configuration production
